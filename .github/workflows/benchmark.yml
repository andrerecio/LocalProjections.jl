name: Benchmark
on:
  pull_request:
    branches:
      - main
      - master

permissions:
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    # AirspeedVelocity resolves the package in fresh comparison environments,
    # where the unregistered [sources] git deps (Regress.jl,
    # MacroEconometricTools.jl) are unsatisfiable on this fork — informative
    # only, never green until those deps are registered.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Run benchmarks
        uses: MilesCranmer/AirspeedVelocity.jl@action-v1
        with:
          julia-version: '1'
          tune: 'false'
