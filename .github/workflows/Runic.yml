name: Runic
on:
  pull_request:
    branches:
      - main
      - port-0.2
  push:
    branches:
      - main
      - port-0.2
    tags: ['*']
jobs:
  runic:
    name: Runic formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fredrikekre/runic-action@v1
        with:
          version: '1'
